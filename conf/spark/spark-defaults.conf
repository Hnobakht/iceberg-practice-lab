# ---------------------------------------------------------------------------
# Spark cluster
# ---------------------------------------------------------------------------

spark.master                                      spark://spark-master:7077
spark.submit.deployMode                           client

# ---------------------------------------------------------------------------
# Hadoop / HDFS
# ---------------------------------------------------------------------------

spark.hadoop.fs.defaultFS                         hdfs://hdfs-namenode:9000
spark.hadoop.dfs.client.use.datanode.hostname     false
spark.hadoop.dfs.permissions.enabled              false

# ---------------------------------------------------------------------------
# Iceberg
# ---------------------------------------------------------------------------

spark.sql.extensions                              org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Downloaded automatically by Spark through Ivy/Maven on first use.
# Later we can move this into a custom Spark Docker image for faster startup.
spark.jars.packages                               org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.11.0

# Iceberg catalog named "hms".
# Table names will look like:
#   hms.database_name.table_name
spark.sql.catalog.hms                             org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.hms.type                        hive
spark.sql.catalog.hms.uri                         thrift://hive-metastore:9083
spark.sql.catalog.hms.warehouse                   hdfs://hdfs-namenode:9000/warehouse/iceberg

# Keep this explicit.
spark.sql.defaultCatalog                          hms

# ---------------------------------------------------------------------------
# Hive Metastore access
# ---------------------------------------------------------------------------

spark.hadoop.hive.metastore.uris                  thrift://hive-metastore:9083

# ---------------------------------------------------------------------------
# Local lab tuning
# ---------------------------------------------------------------------------

spark.serializer                                  org.apache.spark.serializer.KryoSerializer
spark.sql.shuffle.partitions                      4
spark.default.parallelism                         4

spark.driver.memory                               1g
spark.executor.memory                             1g
spark.executor.cores                              1

spark.ui.showConsoleProgress                      true
spark.eventLog.enabled                            false