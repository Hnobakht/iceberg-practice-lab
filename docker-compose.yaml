name: bigdata-local

x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-bigdata-airflow:3.2.2-spark-kubctl}
  build:
    context: ./docker/airflow
    dockerfile: Dockerfile
    target: final
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    # Single Postgres service, Airflow DB.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

    AIRFLOW_CONN_SPARK_K8S: '{"conn_type": "spark", "host": "k8s://https://k3s:6443", "extra": {"deploy-mode": "cluster"}}'

    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    # Airflow 3 API server internal URL.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}

    # Required for the scheduler health endpoint on port 8974.
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    # OK for a lab. For serious use, build a custom Airflow image instead.
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}

    AIRFLOW_CONFIG: "/opt/airflow/config/airflow.cfg"

    # Airflow 3.2.2 image currently uses Python 3.11.
    SPARK_HOME: /home/airflow/.local/lib/python3.11/site-packages/pyspark
    HADOOP_CONF_DIR: /opt/airflow/conf/hadoop
    SPARK_CONF_DIR: /opt/airflow/conf/spark
    PATH: /usr/local/bin:/home/airflow/.local/bin:/home/airflow/.local/lib/python3.11/site-packages/pyspark/bin:/usr/bin:/bin
    KUBECONFIG: /opt/airflow/conf/kubeconfig/k3s.yaml

  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/jobs:/opt/airflow/jobs
    - ${AIRFLOW_PROJ_DIR:-.}/data:/opt/airflow/data
    - ${AIRFLOW_PROJ_DIR:-.}/conf/hadoop-client:/opt/airflow/conf/hadoop:ro
    - ${AIRFLOW_PROJ_DIR:-.}/conf/spark:/opt/airflow/conf/spark:ro
    - ${AIRFLOW_PROJ_DIR:-.}/jars:/opt/spark/extra-jars:ro
    - ivy-cache:/opt/spark/.ivy2
    - kubeconfig:/opt/airflow/conf/kubeconfig:ro

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

  # Critical: all Airflow containers must be on the same network as postgres and redis.
  networks:
    - bigdata

services:
  # ---------------------------------------------------------------------------
  # Single Postgres service for BOTH Airflow and Hive Metastore
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: always
    networks:
      - bigdata

  redis:
    image: redis:7.2-bookworm
    container_name: redis
    hostname: redis
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always
    networks:
      - bigdata

  # ---------------------------------------------------------------------------
  # HDFS
  # ---------------------------------------------------------------------------

  hdfs-namenode:
    image: apache/hadoop:3.4.3
    container_name: hdfs-namenode
    hostname: hdfs-namenode
    restart: unless-stopped
    user: "0:0"
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_LOG_DIR: /tmp/hadoop-logs
      HADOOP_PID_DIR: /tmp/hadoop-pids
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - ./conf/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./hdfs/namenode:/hadoop/dfs/name
    command:
      - bash
      - -c
      - |
        set -e
        echo "Preparing NameNode directories..."
        mkdir -p /hadoop/dfs/name /hadoop/tmp /tmp/hadoop-logs /tmp/hadoop-pids
        chmod -R 777 /hadoop /tmp/hadoop-logs /tmp/hadoop-pids

        if [ ! -d /hadoop/dfs/name/current ]; then
          echo "Formatting HDFS NameNode..."
          hdfs namenode -format -force -nonInteractive
        fi

        echo "Starting HDFS NameNode..."
        exec hdfs namenode
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -fs hdfs://hdfs-namenode:9000 -report >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    networks:
      - bigdata

  hdfs-datanode:
    image: apache/hadoop:3.4.3
    container_name: hdfs-datanode
    hostname: hdfs-datanode
    restart: unless-stopped
    user: "0:0"
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_LOG_DIR: /tmp/hadoop-logs
      HADOOP_PID_DIR: /tmp/hadoop-pids
    ports:
      - "9864:9864"
    volumes:
      - ./conf/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./hdfs/datanode:/hadoop/dfs/data
    command:
      - bash
      - -c
      - |
        set -e
        echo "Preparing DataNode directories..."
        mkdir -p /hadoop/dfs/data /hadoop/tmp /tmp/hadoop-logs /tmp/hadoop-pids
        chmod -R 777 /hadoop /tmp/hadoop-logs /tmp/hadoop-pids

        echo "Starting HDFS DataNode..."
        exec hdfs datanode
    depends_on:
      hdfs-namenode:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9864' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    networks:
      - bigdata

  hdfs-init:
    image: apache/hadoop:3.4.3
    container_name: hdfs-init
    hostname: hdfs-init
    restart: "no"
    user: "0:0"
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    volumes:
      - ./conf/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    command:
      - bash
      - -c
      - |
        set -e

        echo "Waiting for HDFS..."
        for i in $(seq 1 90); do
          if hdfs dfs -fs hdfs://hdfs-namenode:9000 -ls / >/dev/null 2>&1; then
            echo "HDFS is ready."
            break
          fi
          echo "Still waiting for HDFS..."
          sleep 2
        done

        echo "Waiting for NameNode to leave safe mode..."
        hdfs dfsadmin -fs hdfs://hdfs-namenode:9000 -safemode wait

        hdfs dfs -fs hdfs://hdfs-namenode:9000 -mkdir -p /warehouse/iceberg
        hdfs dfs -fs hdfs://hdfs-namenode:9000 -mkdir -p /tmp/hive
        hdfs dfs -fs hdfs://hdfs-namenode:9000 -mkdir -p /user/spark
        hdfs dfs -fs hdfs://hdfs-namenode:9000 -mkdir -p /user/airflow

        hdfs dfs -fs hdfs://hdfs-namenode:9000 -chmod -R 777 /warehouse
        hdfs dfs -fs hdfs://hdfs-namenode:9000 -chmod -R 777 /tmp
        hdfs dfs -fs hdfs://hdfs-namenode:9000 -chmod -R 777 /user

        echo "HDFS init complete."
    depends_on:
      hdfs-namenode:
        condition: service_started
      hdfs-datanode:
        condition: service_started
    networks:
      - bigdata

  # ---------------------------------------------------------------------------
  # Hive Metastore using the same Postgres service
  # ---------------------------------------------------------------------------

  postgres-driver-downloader:
    image: curlimages/curl:8.10.1
    container_name: postgres-driver-downloader
    restart: "no"
    user: "0:0"
    volumes:
      - ./jars:/jars
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /jars

        if [ ! -f /jars/postgresql-42.7.3.jar ]; then
          echo "Downloading PostgreSQL JDBC driver..."
          curl -fL "https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.3/postgresql-42.7.3.jar" -o "/jars/postgresql-42.7.3.jar"
          echo "Downloaded PostgreSQL JDBC driver."
        else
          echo "PostgreSQL JDBC driver already exists."
        fi

        ls -lh /jars/postgresql-42.7.3.jar
    networks:
      - bigdata

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    hostname: hive-metastore
    restart: unless-stopped
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_CUSTOM_CONF_DIR: /opt/hive/conf
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
      SERVICE_OPTS: >-
        -Xmx1G
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
        -Dhive.metastore.warehouse.dir=hdfs://hdfs-namenode:9000/warehouse/iceberg
        -Dhive.metastore.uris=thrift://hive-metastore:9083
    ports:
      - "9083:9083"
    volumes:
      - ./conf/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./conf/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./jars/postgresql-42.7.3.jar:/opt/hive/lib/postgres.jar:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-driver-downloader:
        condition: service_completed_successfully
      hdfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9083' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s
    networks:
      - bigdata

  # ---------------------------------------------------------------------------
  # Spark standalone cluster
  # ---------------------------------------------------------------------------

  spark-master:
    image: spark:3.5.8-scala2.12-java17-python3-ubuntu
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped
    user: "spark"
    environment:
      SPARK_CONF_DIR: /opt/spark/conf
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      SPARK_NO_DAEMONIZE: "true"
      HOME: /opt/spark
    ports:
      - "8081:8080"
      - "7077:7077"
      - "4040:4040"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/conf/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ${AIRFLOW_PROJ_DIR:-.}/conf/hadoop-client:/opt/hadoop/etc/hadoop:ro
      - ${AIRFLOW_PROJ_DIR:-.}/jobs:/opt/spark/jobs
      - ${AIRFLOW_PROJ_DIR:-.}/data:/opt/spark/data
      - ${AIRFLOW_PROJ_DIR:-.}/jars:/opt/spark/extra-jars:ro
      - ivy-cache:/opt/spark/.ivy2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    depends_on:
      hive-metastore:
        condition: service_started
      hdfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    networks:
      - bigdata

  spark-worker:
    image: spark:3.5.8-scala2.12-java17-python3-ubuntu
    container_name: spark-worker
    hostname: spark-worker
    restart: unless-stopped
    user: "spark"
    environment:
      SPARK_CONF_DIR: /opt/spark/conf
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      SPARK_NO_DAEMONIZE: "true"
      HOME: /opt/spark
    ports:
      - "8082:8081"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/conf/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ${AIRFLOW_PROJ_DIR:-.}/conf/hadoop-client:/opt/hadoop/etc/hadoop:ro
      - ${AIRFLOW_PROJ_DIR:-.}/jobs:/opt/spark/jobs
      - ${AIRFLOW_PROJ_DIR:-.}/data:/opt/spark/data
      - ${AIRFLOW_PROJ_DIR:-.}/jars:/opt/spark/extra-jars:ro
      - ivy-cache:/opt/spark/.ivy2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8081
      --cores 2
      --memory 2g
    depends_on:
      spark-master:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8081' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    networks:
      - bigdata

  # ---------------------------------------------------------------------------
  # Airflow 3 services
  # ---------------------------------------------------------------------------

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    # For local dev, use a simple "is the API server responding" check.
    # The deeper /api/v2/monitor/health endpoint can report unhealthy while
    # scheduler/triggerer are still warming up.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8974/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    container_name: airflow-worker
    command: celery worker
    healthcheck:
      test:
        - CMD-SHELL
        - >
          celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" ||
          celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" ||
          exit 1
      interval: 30s
      timeout: 20s
      retries: 30
      start_period: 300s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    user: "0:0"
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "Setting AIRFLOW_UID from current container user."
          export AIRFLOW_UID=$$(id -u)
        fi

        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')

        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB memory required."
        fi

        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUs available for Docker.\e[0m"
          echo "At least 2 CPUs recommended."
        fi

        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough disk space available for Docker.\e[0m"
          echo "At least 10GB recommended."
        fi

        mkdir -v -p /opt/airflow/{logs,dags,plugins,config,jobs,data}
        mkdir -v -p /opt/airflow/logs/scheduler
        mkdir -v -p /opt/airflow/logs/dag_processor

        echo
        echo "Airflow version:"
        /entrypoint airflow version

        echo
        echo "Running airflow config list to create default config file if missing."
        /entrypoint airflow config list >/dev/null

        echo
        echo "Changing ownership of files in /opt/airflow to ${AIRFLOW_UID}:0"
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/

        echo
        echo "Changing ownership of shared volumes to ${AIRFLOW_UID}:0"
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins,config,jobs,data}

        echo
        echo "Fixing ivy-cache permissions..."
        mkdir -p /opt/spark/.ivy2
        chmod -R 777 /opt/spark/.ivy2

        echo
        echo "Airflow init complete."
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    container_name: airflow-cli
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

  flower:
    <<: *airflow-common
    container_name: flower
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5555/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # K3s cluster for Spark on K8s
  # ---------------------------------------------------------------------------

  k3s:
    image: rancher/k3s:v1.31.2-k3s1
    container_name: k3s
    privileged: true
    networks:
      - bigdata
    command: server --disable=traefik --disable=servicelb --tls-san=k3s
    environment:
      - K3S_KUBECONFIG_MODE=644
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - kubeconfig:/etc/rancher/k3s
      - ./jobs:/opt/spark/jobs
      - ./data:/opt/spark/data
    ports:
      - "6443:6443"
    healthcheck:
      test: ["CMD-SHELL", "kubectl get nodes >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  k3s-init:
    image: rancher/k3s:v1.31.2-k3s1
    container_name: k3s-init
    networks:
      - bigdata
    volumes:
      - kubeconfig:/etc/rancher/k3s
      - ./k8s:/k8s
    depends_on:
      k3s:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Preparing kubeconfig..."
        # Wait for k3s to generate the file
        until [ -f /etc/rancher/k3s/k3s.yaml ]; do sleep 2; done

        # Replace 127.0.0.1 with k3s host for both this container and Airflow
        sed -i 's/127.0.0.1/k3s/g' /etc/rancher/k3s/k3s.yaml

        echo "Waiting for K3s to be ready..."
        until kubectl get nodes; do sleep 2; done

        echo "Applying K8s manifests..."
        kubectl apply -f /k8s/spark-rbac.yaml
        kubectl apply -f /k8s/external-services.yaml

        echo "K3s initialization complete."

networks:
  bigdata:
    name: bigdata-local-net

volumes:
  postgres-db-volume:
  ivy-cache:
  k3s-data:
  kubeconfig: