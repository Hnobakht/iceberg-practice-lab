name: bigdata-local

x-airflow-common: &airflow-common
  image: apache/airflow:2.11.0-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: local-dev-secret-key
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    # Installed at container startup for local learning.
    # Later we can replace this with a proper custom Airflow Dockerfile.
    _PIP_ADDITIONAL_REQUIREMENTS: >
      apache-airflow-providers-apache-spark==6.0.2
      pyspark==3.5.8

    # Let Airflow's SparkSubmitOperator find spark-submit from the pyspark package.
    SPARK_HOME: /home/airflow/.local/lib/python3.11/site-packages/pyspark
    HADOOP_CONF_DIR: /opt/airflow/conf/hadoop
    SPARK_CONF_DIR: /opt/airflow/conf/spark
    PATH: /home/airflow/.local/bin:/home/airflow/.local/lib/python3.11/site-packages/pyspark/bin:/usr/local/bin:/usr/bin:/bin

  volumes:
    - ./dags:/opt/airflow/dags
    - ./jobs:/opt/airflow/jobs
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./conf/hadoop-client:/opt/airflow/conf/hadoop:ro
    - ./conf/spark:/opt/airflow/conf/spark:ro
    - ivy-cache:/home/airflow/.ivy2
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-postgres:
      condition: service_healthy
    spark-master:
      condition: service_started
    hive-metastore:
      condition: service_started

services:
  # ---------------------------------------------------------------------------
  # HDFS
  # ---------------------------------------------------------------------------

  hdfs-namenode:
    image: apache/hadoop:3.4.3
    container_name: hdfs-namenode
    hostname: hdfs-namenode
    restart: unless-stopped
    user: "0:0"
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_LOG_DIR: /tmp/hadoop-logs
      HADOOP_PID_DIR: /tmp/hadoop-pids
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - ./conf/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./hdfs/namenode:/hadoop/dfs/name
    command:
      - bash
      - -c
      - |
        set -e

        echo "Preparing NameNode directories..."
        mkdir -p /hadoop/dfs/name
        mkdir -p /hadoop/tmp
        mkdir -p /tmp/hadoop-logs
        mkdir -p /tmp/hadoop-pids
        chmod -R 777 /hadoop
        chmod -R 777 /tmp/hadoop-logs
        chmod -R 777 /tmp/hadoop-pids

        if [ ! -d /hadoop/dfs/name/current ]; then
          echo "Formatting HDFS NameNode..."
          hdfs namenode -format -force -nonInteractive
        fi

        echo "Starting HDFS NameNode..."
        exec hdfs namenode
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -fs hdfs://hdfs-namenode:9000 -report >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - bigdata

  hdfs-datanode:
    image: apache/hadoop:3.4.3
    container_name: hdfs-datanode
    hostname: hdfs-datanode
    restart: unless-stopped
    user: "0:0"
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_LOG_DIR: /tmp/hadoop-logs
      HADOOP_PID_DIR: /tmp/hadoop-pids
    ports:
      - "9864:9864"
    volumes:
      - ./conf/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./hdfs/datanode:/hadoop/dfs/data
    command:
      - bash
      - -c
      - |
        set -e

        echo "Preparing DataNode directories..."
        mkdir -p /hadoop/dfs/data
        mkdir -p /hadoop/tmp
        mkdir -p /tmp/hadoop-logs
        mkdir -p /tmp/hadoop-pids
        chmod -R 777 /hadoop
        chmod -R 777 /tmp/hadoop-logs
        chmod -R 777 /tmp/hadoop-pids

        echo "Starting HDFS DataNode..."
        exec hdfs datanode
    depends_on:
      hdfs-namenode:
        condition: service_started
    networks:
      - bigdata

  hdfs-init:
    image: apache/hadoop:3.4.3
    container_name: hdfs-init
    hostname: hdfs-init
    restart: "no"
    user: "0:0"
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    volumes:
      - ./conf/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    command:
      - bash
      - -c
      - |
        set -e

        echo "Waiting for HDFS..."
        for i in $(seq 1 60); do
          if hdfs dfs -fs hdfs://hdfs-namenode:9000 -ls / >/dev/null 2>&1; then
            echo "HDFS is ready."
            break
          fi
          echo "Still waiting for HDFS..."
          sleep 2
        done

        hdfs dfs -fs hdfs://hdfs-namenode:9000 -mkdir -p /warehouse/iceberg
        hdfs dfs -fs hdfs://hdfs-namenode:9000 -mkdir -p /tmp/hive
        hdfs dfs -fs hdfs://hdfs-namenode:9000 -mkdir -p /user/spark
        hdfs dfs -fs hdfs://hdfs-namenode:9000 -mkdir -p /user/airflow

        hdfs dfs -fs hdfs://hdfs-namenode:9000 -chmod -R 777 /warehouse
        hdfs dfs -fs hdfs://hdfs-namenode:9000 -chmod -R 777 /tmp
        hdfs dfs -fs hdfs://hdfs-namenode:9000 -chmod -R 777 /user

        echo "HDFS init complete."
    depends_on:
      hdfs-namenode:
        condition: service_started
      hdfs-datanode:
        condition: service_started
    networks:
      - bigdata

  # ---------------------------------------------------------------------------
  # Hive Metastore Postgres backend
  # ---------------------------------------------------------------------------

  hms-postgres:
    image: postgres:16
    container_name: hms-postgres
    hostname: hms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    ports:
      - "5433:5432"
    volumes:
      - hms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - bigdata

  postgres-driver-downloader:
    image: curlimages/curl:8.10.1
    container_name: postgres-driver-downloader
    restart: "no"
    user: "0:0"
    volumes:
      - ./jars:/jars
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /jars

        if [ ! -f /jars/postgresql-42.7.3.jar ]; then
          echo "Downloading PostgreSQL JDBC driver..."
          curl -fL "https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.3/postgresql-42.7.3.jar" -o "/jars/postgresql-42.7.3.jar"
          echo "Downloaded PostgreSQL JDBC driver."
        else
          echo "PostgreSQL JDBC driver already exists."
        fi

        ls -lh /jars/postgresql-42.7.3.jar
    networks:
      - bigdata

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    hostname: hive-metastore
    restart: unless-stopped
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_CUSTOM_CONF_DIR: /opt/hive/conf
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
      SERVICE_OPTS: >-
        -Xmx1G
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hms-postgres:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
        -Dhive.metastore.warehouse.dir=hdfs://hdfs-namenode:9000/warehouse/iceberg
        -Dhive.metastore.uris=thrift://hive-metastore:9083
    ports:
      - "9083:9083"
    volumes:
      - ./conf/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./conf/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./jars/postgresql-42.7.3.jar:/opt/hive/lib/postgres.jar:ro
    depends_on:
      hms-postgres:
        condition: service_healthy
      postgres-driver-downloader:
        condition: service_completed_successfully
      hdfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9083' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - bigdata

  # ---------------------------------------------------------------------------
  # Spark standalone cluster
  # ---------------------------------------------------------------------------

  spark-master:
    image: spark:3.5.8-scala2.12-java17-python3-ubuntu
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped
    environment:
      SPARK_CONF_DIR: /opt/spark/conf
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8080:8080"   # Spark Master UI
      - "7077:7077"   # Spark Master RPC
      - "4040:4040"   # Spark driver UI, useful for client-mode tests
    volumes:
      - ./conf/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./conf/hadoop-client:/opt/hadoop/etc/hadoop:ro
      - ./jobs:/opt/spark/jobs
      - ./data:/opt/spark/data
      - ivy-cache:/root/.ivy2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    depends_on:
      hive-metastore:
        condition: service_started
    networks:
      - bigdata

  spark-worker:
    image: spark:3.5.8-scala2.12-java17-python3-ubuntu
    container_name: spark-worker
    hostname: spark-worker
    restart: unless-stopped
    environment:
      SPARK_CONF_DIR: /opt/spark/conf
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8081:8081"   # Spark Worker UI
    volumes:
      - ./conf/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./conf/hadoop-client:/opt/hadoop/etc/hadoop:ro
      - ./jobs:/opt/spark/jobs
      - ./data:/opt/spark/data
      - ivy-cache:/root/.ivy2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8081
      --cores 2
      --memory 2g
    depends_on:
      spark-master:
        condition: service_started
    networks:
      - bigdata

  # ---------------------------------------------------------------------------
  # Airflow metadata DB
  # ---------------------------------------------------------------------------

  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    hostname: airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    ports:
      - "5434:5432"
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - bigdata

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    restart: "no"
    entrypoint: /bin/bash
    command: >
      -c "
        airflow db migrate;

        airflow users create
          --username airflow
          --password airflow
          --firstname Airflow
          --lastname Admin
          --role Admin
          --email airflow@example.com
          || true;

        airflow connections delete spark_standalone || true;

        airflow connections add spark_standalone
          --conn-type spark
          --conn-host spark://spark-master
          --conn-port 7077;

        echo 'Airflow init complete.';
      "
    depends_on:
      airflow-postgres:
        condition: service_healthy
    networks:
      - bigdata

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    hostname: airflow-webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "8088:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
    networks:
      - bigdata

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    hostname: airflow-scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - bigdata

networks:
  bigdata:
    name: bigdata-local-net

volumes:
  hms-postgres-data:
  airflow-postgres-data:
  ivy-cache: