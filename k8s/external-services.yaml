# This file is intentionally placed as a static manifest.
#
# Docker Compose container IPs can change after containers are recreated.
# The k3s-init service now runs /k8s/sync-external-services.sh, which resolves
# the current Docker Compose IPs and applies Kubernetes Service + Endpoints
# objects for:
#   - hive-metastore
#   - hdfs-namenode
#   - hdfs-datanode
#   - postgres
#
# See k8s/sync-external-services.sh for the generated manifest.
